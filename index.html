<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Repaso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — bottom tab bar on phone, left rail on Mac; sessions take over the full screen, one exercise at a time. */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --sunk:#E8ECF6; --ink:#111835; --muted:#566086; --line:#DDE2EF; --line-deep:#C4CBE0;
  --cobalt:#2446D8; --cobalt-deep:#1732A8; --cobalt-soft:#E2E8FF; --on-cobalt:#FFFFFF;
  --saffron:#EFA316; --saffron-deep:#C7820A; --saffron-soft:#FFF0D2;
  --ok:#1E9A61; --ok-deep:#167649; --ok-soft:#DCF4E8;
  --bad:#D6423A; --bad-deep:#AC2E27; --bad-soft:#FCE3E0;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-ui:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(19,25,54,.05), 0 8px 24px rgba(19,25,54,.06);
  --lift:0 1px 0 rgba(19,25,54,.04), 0 6px 18px -8px rgba(19,25,54,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F21; --surface:#141A31; --sunk:#1B2240; --ink:#EDF0FA; --muted:#9AA3C4; --line:#252D4D; --line-deep:#323C63;
  --cobalt:#7A93FF; --cobalt-deep:#4C63D6; --cobalt-soft:#1D2654; --on-cobalt:#0A0F2B;
  --saffron:#F5B848; --saffron-deep:#B9861F; --saffron-soft:#372B10;
  --ok:#3DCB8B; --ok-deep:#24925F; --ok-soft:#11342A;
  --bad:#FF6E63; --bad-deep:#C2443B; --bad-soft:#3B1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0F21; --surface:#141A31; --sunk:#1B2240; --ink:#EDF0FA; --muted:#9AA3C4; --line:#252D4D; --line-deep:#323C63;
  --cobalt:#7A93FF; --cobalt-deep:#4C63D6; --cobalt-soft:#1D2654; --on-cobalt:#0A0F2B;
  --saffron:#F5B848; --saffron-deep:#B9861F; --saffron-soft:#372B10;
  --ok:#3DCB8B; --ok-deep:#24925F; --ok-soft:#11342A;
  --bad:#FF6E63; --bad-deep:#C2443B; --bad-soft:#3B1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:500 16px/1.5 var(--f-ui); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
input,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--cobalt); outline-offset:2px; border-radius:8px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

/* ---------- shell ---------- */
.shell{min-height:100%; display:grid; grid-template-columns:1fr}
.rail{display:none}
.main{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:20px 120px; width:100%; max-width:760px; margin:0 auto; min-width:0}
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(4,1fr); align-items:center;
  background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line); padding:8px max(8px, env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px))}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; font-size:.72rem; font-weight:700; color:var(--muted); border-radius:12px}
.tab svg{width:26px; height:26px}
.tab[aria-current="page"]{color:var(--cobalt)}
.tab-add{justify-self:center; width:52px; height:52px; border-radius:18px; background:var(--cobalt); color:var(--on-cobalt); display:grid; place-items:center; box-shadow:0 4px 0 var(--cobalt-deep); transition:transform .08s, box-shadow .08s}
.tab-add:active{transform:translateY(4px); box-shadow:0 0 0 var(--cobalt-deep)}
.tab-add svg{width:26px; height:26px}
@media (min-width:900px){
  .shell{grid-template-columns:248px 1fr}
  .rail{display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; padding:28px 16px; border-right:1px solid var(--line); background:var(--surface)}
  .rail .brand{margin:0 10px 22px}
  .rail .nav{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:14px; font-weight:700; color:var(--muted); text-align:left}
  .rail .nav svg{width:24px; height:24px}
  .rail .nav:hover{background:var(--sunk); color:var(--ink)}
  .rail .nav[aria-current="page"]{background:var(--cobalt-soft); color:var(--cobalt)}
  .rail .btn{margin-top:14px}
  .rail .foot{margin-top:auto; font-size:.8rem; color:var(--muted); padding:0 10px}
  .tabs{display:none}
  .main{padding-block:40px 60px}
}
@media (min-width:1200px){.main{max-width:880px}}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:800; font-size:1.45rem; letter-spacing:-.03em}
.brand-mark{width:34px; height:34px; border-radius:11px; background:var(--cobalt); color:var(--on-cobalt); display:grid; place-items:center; font-size:1.25rem; box-shadow:0 3px 0 var(--cobalt-deep)}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 22px; border-radius:var(--r-md);
  background:var(--cobalt); color:var(--on-cobalt); font-weight:800; font-size:1rem; letter-spacing:.01em; text-transform:none;
  box-shadow:0 4px 0 var(--cobalt-deep); transition:transform .08s ease, box-shadow .08s ease, filter .15s}
.btn svg{width:22px; height:22px; flex-shrink:0}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px); box-shadow:0 0 0 var(--cobalt-deep)}
.btn[disabled]{background:var(--sunk); color:var(--muted); box-shadow:0 4px 0 var(--line-deep); cursor:not-allowed; filter:none; transform:none}
.btn.ok{background:var(--ok); box-shadow:0 4px 0 var(--ok-deep); color:#fff}
.btn.bad{background:var(--bad); box-shadow:0 4px 0 var(--bad-deep); color:#fff}
.btn.ghost{background:var(--surface); color:var(--ink); box-shadow:0 4px 0 var(--line-deep); border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line-deep)}
.btn.wide{width:100%}
.btn.sm{min-height:42px; padding:0 16px; font-size:.92rem; border-radius:13px}
.link{color:var(--cobalt); font-weight:700; padding:4px 2px}
.icon-btn{width:42px; height:42px; display:grid; place-items:center; border-radius:13px; color:var(--muted)}
.icon-btn:hover{background:var(--sunk); color:var(--ink)}
.icon-btn svg{width:24px; height:24px}

/* ---------- today ---------- */
.today-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:22px}
.today-head .brand{font-size:1.3rem}
@media (min-width:900px){.today-head .brand{display:none}}
.date-es{font-family:var(--f-display); font-weight:700; font-size:1.9rem; line-height:1.1; margin-top:6px; text-transform:none}
.date-es::first-letter{text-transform:uppercase}
.chips-stat{display:flex; gap:8px; flex-shrink:0}
.stat-chip{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-weight:800}
.stat-chip svg{width:20px; height:20px}
.stat-chip.sun{color:var(--saffron-deep)}
:root[data-theme="dark"] .stat-chip.sun{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat-chip.sun{color:var(--saffron)}}

.hero{position:relative; overflow:hidden; border-radius:var(--r-lg); background:var(--cobalt); color:var(--on-cobalt); padding:24px; display:grid; grid-template-columns:1fr auto; gap:18px; align-items:center; box-shadow:0 6px 0 var(--cobalt-deep)}
.hero .tiles{position:absolute; inset:0; opacity:.13; pointer-events:none; background-image:
  radial-gradient(circle at 50% 50%, transparent 38%, currentColor 39%, currentColor 41%, transparent 42%),
  linear-gradient(45deg, transparent 47%, currentColor 48%, currentColor 52%, transparent 53%),
  linear-gradient(-45deg, transparent 47%, currentColor 48%, currentColor 52%, transparent 53%);
  background-size:56px 56px; -webkit-mask-image:linear-gradient(100deg, transparent 35%, #000 100%); mask-image:linear-gradient(100deg, transparent 35%, #000 100%)}
.hero > *{position:relative}
.hero h2{font-size:1.75rem; line-height:1.1}
.hero p{margin:6px 0 18px; opacity:.88; font-weight:600}
.hero .btn{background:var(--on-cobalt); color:var(--cobalt); box-shadow:0 4px 0 color-mix(in srgb, var(--on-cobalt) 55%, var(--cobalt-deep))}
.ring{width:108px; height:108px}
.ring .track{stroke:color-mix(in srgb, var(--on-cobalt) 22%, transparent)}
.ring .bar{stroke:var(--saffron); transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring-label{font-family:var(--f-display); font-weight:800}
@media (max-width:480px){.hero{grid-template-columns:1fr} .hero .ring-wrap{display:none}}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; min-width:0}
.tap-card{display:flex; flex-direction:column; gap:6px; text-align:left; transition:transform .12s, border-color .12s; width:100%}
.tap-card:hover{border-color:var(--line-deep); transform:translateY(-1px)}
.tap-card .big{font-family:var(--f-display); font-size:2rem; font-weight:800; line-height:1}
.tap-card .sub{color:var(--muted); font-weight:600; font-size:.92rem}
.tap-card.weak .big{color:var(--bad)}
.tap-card[disabled]{cursor:default; transform:none}
.tap-card.weak[disabled] .big{color:var(--muted)}
.section-title{flex-wrap:wrap; gap:4px 12px}
.section-title{display:flex; align-items:baseline; justify-content:space-between; margin:30px 0 12px}
.section-title h3{font-size:1.2rem}

.mastery{display:flex; height:12px; border-radius:99px; overflow:hidden; background:var(--sunk); margin:12px 0 10px}
.mastery span{display:block; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.85rem; color:var(--muted); font-weight:600}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.c-new{background:var(--line-deep)} .c-learn{background:var(--saffron)} .c-weak{background:var(--bad)} .c-solid{background:var(--ok)}

/* ---------- empty / welcome ---------- */
.welcome{padding:28px 22px; text-align:left}
.welcome .marks{font-family:var(--f-display); font-weight:800; font-size:4.2rem; line-height:.8; color:var(--cobalt); letter-spacing:-.04em}
.welcome h2{font-size:1.7rem; margin:14px 0 8px}
.welcome p{color:var(--muted); margin:0 0 20px; max-width:52ch}
.welcome .row{display:flex; flex-wrap:wrap; gap:12px}
.welcome h2{line-height:1.1}
@media (max-width:560px){.welcome .row .btn{width:100%}}
.steps3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:22px}
@media (max-width:560px){.steps3{grid-template-columns:1fr}}
.steps3 div{background:var(--sunk); border-radius:var(--r-md); padding:14px; font-size:.9rem; color:var(--muted); font-weight:600}
.steps3 b{display:block; color:var(--ink); font-family:var(--f-display); font-size:1.05rem; margin-bottom:2px}

/* ---------- path ---------- */
.page-head{margin-bottom:18px}
.page-head h1{font-size:2rem}
.page-head p{margin:4px 0 0; color:var(--muted); font-weight:600}
.path{position:relative; display:flex; flex-direction:column; gap:10px}
.path::before{content:""; position:absolute; left:33px; top:30px; bottom:30px; width:3px; border-radius:2px; background:repeating-linear-gradient(to bottom, var(--line-deep) 0 8px, transparent 8px 14px)}
.lesson-row{position:relative; display:grid; grid-template-columns:68px 1fr auto; gap:14px; align-items:center; text-align:left; padding:10px 14px 10px 0; border-radius:var(--r-lg); width:100%}
.lesson-row:hover{background:var(--surface)}
.node{width:68px; height:68px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--ok) calc(var(--p)*1%), var(--line) 0); position:relative}
.node::after{content:""; position:absolute; inset:6px; border-radius:50%; background:var(--surface)}
.node b{position:relative; z-index:1; font-family:var(--f-display); font-weight:800; font-size:1.1rem}
.node.ex::after{background:var(--saffron-soft)}
.lesson-row .t{font-family:var(--f-display); font-weight:700; font-size:1.12rem; line-height:1.2}
.lesson-row .m{color:var(--muted); font-size:.88rem; font-weight:600; margin-top:2px}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:.76rem; font-weight:800; background:var(--sunk); color:var(--muted); white-space:nowrap}
.pill.due{background:var(--cobalt-soft); color:var(--cobalt)}
.pill.weak{background:var(--bad-soft); color:var(--bad)}
.pill.ex{background:var(--saffron-soft); color:var(--saffron-deep)}
.pill.ok{background:var(--ok-soft); color:var(--ok)}

/* ---------- notebook ---------- */
.search{display:flex; align-items:center; gap:10px; background:var(--surface); border:2px solid var(--line); border-radius:var(--r-md); padding:0 14px; height:50px}
.search:focus-within{border-color:var(--cobalt)}
.search input{flex:1; border:0; background:none; outline:none; min-width:0; font-weight:600}
.search svg{width:20px; height:20px; color:var(--muted)}
.filters{display:flex; gap:8px; overflow-x:auto; padding:12px 0 6px; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{padding:8px 14px; border-radius:999px; border:2px solid var(--line); background:var(--surface); font-weight:700; font-size:.88rem; white-space:nowrap; color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--cobalt); background:var(--cobalt-soft); color:var(--cobalt)}
.words{display:flex; flex-direction:column; margin-top:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.word{display:grid; grid-template-columns:12px 1fr auto; gap:14px; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line); text-align:left; width:100%}
.word:last-child{border-bottom:0}
.word:hover{background:var(--sunk)}
.word .dot{width:10px; height:10px; border-radius:50%}
.word .es{font-weight:800; font-size:1.02rem}
.word .it{color:var(--muted); font-size:.9rem; font-weight:600}
.word .l{font-size:.78rem; color:var(--muted); font-weight:700}
.word-detail{padding:4px 16px 16px 42px; border-bottom:1px solid var(--line); font-size:.93rem; color:var(--muted); background:var(--sunk)}
.word-detail .exs{margin-top:6px; color:var(--ink)}
.empty-note{padding:30px 16px; text-align:center; color:var(--muted); font-weight:600}

/* ---------- sheet ---------- */
.scrim{position:fixed; inset:0; z-index:40; background:rgba(8,12,30,.45); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease}
.sheet{width:100%; max-width:680px; max-height:calc(100% - 24px - env(safe-area-inset-top,0px)); background:var(--bg); border-radius:26px 26px 0 0; display:flex; flex-direction:column; overflow:hidden; animation:rise .32s cubic-bezier(.2,.9,.25,1)}
@media (min-width:760px){.scrim{align-items:center; padding:24px} .sheet{border-radius:26px; max-height:min(860px, 100%)}}
.sheet-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px max(18px, env(safe-area-inset-right,0px)) 10px max(18px, env(safe-area-inset-left,0px))}
.sheet-head h2{font-size:1.35rem}
.sheet-body{overflow-y:auto; padding:6px max(18px, env(safe-area-inset-right,0px)) 18px max(18px, env(safe-area-inset-left,0px)); flex:1; min-height:0}
.sheet-foot{padding:12px max(18px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px)); border-top:1px solid var(--line); background:var(--surface); display:flex; gap:10px; align-items:center}
.sheet-foot .grow{flex:1; color:var(--muted); font-weight:600; font-size:.9rem}
@keyframes rise{from{transform:translateY(40px); opacity:0}}
@keyframes fade{from{opacity:0}}

.drop{border:2.5px dashed var(--line-deep); border-radius:var(--r-lg); padding:30px 20px; text-align:center; background:var(--surface); transition:border-color .15s, background .15s; cursor:pointer; display:block; width:100%}
.drop:hover,.drop.over{border-color:var(--cobalt); background:var(--cobalt-soft)}
.drop svg{width:44px; height:44px; color:var(--cobalt)}
.drop b{display:block; font-family:var(--f-display); font-size:1.15rem; margin:8px 0 2px}
.drop span{color:var(--muted); font-weight:600; font-size:.9rem}
.files{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.file{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px}
.file .ext{width:40px; height:40px; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:.72rem; color:#fff; background:var(--bad); flex-shrink:0}
.file .ext.docx{background:var(--cobalt)} .file .ext.txt{background:var(--muted)} .file .ext.img{background:var(--ok)}
.file .n{flex:1; min-width:0; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.file .s{color:var(--muted); font-size:.82rem; font-weight:600}
.field{display:flex; flex-direction:column; gap:6px; margin-top:16px}
.field label{font-size:.8rem; font-weight:800; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.input{background:var(--surface); border:2px solid var(--line); border-radius:var(--r-sm); padding:11px 13px; font-weight:600; outline:none; width:100%; min-width:0}
.input:focus{border-color:var(--cobalt)}
textarea.input{min-height:140px; resize:vertical; line-height:1.45}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.notice{margin-top:14px; padding:12px 14px; border-radius:var(--r-md); background:var(--saffron-soft); color:var(--ink); font-size:.9rem; font-weight:600}
.notice.err{background:var(--bad-soft)}

.work{padding:26px 6px; display:flex; flex-direction:column; gap:18px}
.work .orb{width:84px; height:84px; border-radius:26px; background:var(--cobalt); color:var(--on-cobalt); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:2.6rem; box-shadow:0 5px 0 var(--cobalt-deep); animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.wsteps{display:flex; flex-direction:column; gap:10px}
.wstep{display:flex; align-items:center; gap:12px; font-weight:700; color:var(--muted)}
.wstep i{width:26px; height:26px; border-radius:50%; border:2.5px solid var(--line-deep); display:grid; place-items:center; flex-shrink:0}
.wstep.on{color:var(--ink)} .wstep.on i{border-color:var(--cobalt); border-top-color:transparent; animation:spin .8s linear infinite}
.wstep.done{color:var(--ink)} .wstep.done i{background:var(--ok); border-color:var(--ok); color:#fff}
.wstep.done i::after{content:"✓"; font-size:.8rem; font-weight:900}
@keyframes spin{to{transform:rotate(360deg)}}
.live-count{font-family:var(--f-display); font-weight:800; font-size:2.6rem; line-height:1}

.rgroup{margin-top:20px}
.rgroup h4{margin:0 0 8px; font-family:var(--f-display); font-size:1.02rem; display:flex; gap:8px; align-items:center}
.ritems{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.ritem{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:11px 12px; border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
.ritem.off{opacity:.45}
.ritem.off .es{text-decoration:line-through}
.check{width:28px; height:28px; border-radius:9px; border:2.5px solid var(--line-deep); display:grid; place-items:center; color:transparent; flex-shrink:0}
.check[aria-checked="true"]{background:var(--cobalt); border-color:var(--cobalt); color:var(--on-cobalt)}
.check svg{width:16px; height:16px}
.ritem .es{font-weight:800}
.ritem .it{color:var(--muted); font-size:.88rem; font-weight:600}
.ritem .dup{font-size:.76rem; color:var(--saffron-deep); font-weight:800}
.ritem .edit{grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr; gap:8px}
@media (max-width:480px){.ritem .edit{grid-template-columns:1fr}}

.lesson-sum{color:var(--muted); font-weight:600; margin:0 0 12px}
.topic-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px}
.confirm-bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px; border-radius:var(--r-md); background:var(--bad-soft); margin-top:12px; font-weight:700}

/* ---------- session ---------- */
.session{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); animation:fade .2s}
.s-top{display:flex; align-items:center; gap:14px; padding:14px max(16px, env(safe-area-inset-right,0px)) 6px max(16px, env(safe-area-inset-left,0px)); max-width:720px; width:100%; margin:0 auto}
.progress{flex:1; height:16px; border-radius:99px; background:var(--sunk); overflow:hidden}
.progress span{display:block; height:100%; border-radius:99px; background:var(--ok); width:0; transition:width .5s cubic-bezier(.2,.9,.25,1.2); position:relative}
.progress span::after{content:""; position:absolute; left:8px; right:8px; top:3px; height:4px; border-radius:4px; background:rgba(255,255,255,.35)}
.s-xp{font-family:var(--f-display); font-weight:800; color:var(--saffron-deep); min-width:56px; text-align:right}
.s-body{flex:1; overflow-y:auto; padding:18px max(16px, env(safe-area-inset-right,0px)) 30px max(16px, env(safe-area-inset-left,0px))}
.s-inner{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:18px; animation:enter .35s cubic-bezier(.2,.9,.25,1)}
@keyframes enter{from{opacity:0; transform:translateX(24px)}}
.s-kicker{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.s-kicker .k{font-family:var(--f-display); font-weight:800; font-size:1.45rem; letter-spacing:-.02em}
.s-kicker .new{color:var(--saffron-deep)}
.prompt{display:flex; align-items:center; gap:14px}
.prompt .say{font-family:var(--f-display); font-weight:700; font-size:clamp(1.5rem, 5vw, 2.1rem); line-height:1.15; text-wrap:balance}
.speak{width:52px; height:52px; border-radius:16px; background:var(--cobalt); color:var(--on-cobalt); display:grid; place-items:center; flex-shrink:0; box-shadow:0 4px 0 var(--cobalt-deep); transition:transform .08s, box-shadow .08s}
.speak:active{transform:translateY(4px); box-shadow:0 0 0 var(--cobalt-deep)}
.speak svg{width:26px; height:26px}
.speak.big{width:96px; height:96px; border-radius:28px} .speak.big svg{width:46px; height:46px}
.speak.slow{width:52px; height:52px; background:var(--surface); color:var(--cobalt); box-shadow:0 4px 0 var(--line-deep); border:2px solid var(--line)}
.opts{display:grid; gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:420px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex; align-items:center; gap:12px; text-align:left; padding:15px 16px; border-radius:var(--r-md); background:var(--surface); border:2px solid var(--line); box-shadow:0 3px 0 var(--line); font-weight:700; font-size:1.05rem; transition:transform .08s, box-shadow .08s, border-color .12s, background .12s}
.opt:active{transform:translateY(3px); box-shadow:0 0 0 var(--line)}
.opt .kbd{width:26px; height:26px; border-radius:8px; border:2px solid var(--line); display:grid; place-items:center; font-size:.78rem; color:var(--muted); flex-shrink:0}
.opt[aria-pressed="true"]{border-color:var(--cobalt); background:var(--cobalt-soft); box-shadow:0 3px 0 var(--cobalt)}
.opt.right{border-color:var(--ok); background:var(--ok-soft); box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft); box-shadow:0 3px 0 var(--bad); animation:shake .35s}
.opt.gone{opacity:0; transform:scale(.92); pointer-events:none; transition:opacity .3s, transform .3s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.answer-box{background:var(--surface); border:2px solid var(--line); border-radius:var(--r-md); padding:4px; transition:border-color .12s}
.answer-box:focus-within{border-color:var(--cobalt)}
.answer-box textarea{display:block; width:100%; border:0; background:none; resize:none; outline:none; font-weight:700; font-size:1.2rem; padding:12px; min-height:84px}
.accents{display:grid; grid-template-columns:repeat(9, minmax(0, 1fr)); gap:6px; max-width:460px}
.accents button{height:42px; padding:0; border-radius:11px; background:var(--surface); border:2px solid var(--line); box-shadow:0 2px 0 var(--line); font-weight:800; font-size:1.05rem}
.accents button:active{transform:translateY(2px); box-shadow:none}
.lane{min-height:64px; border-bottom:2px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; padding:8px 0 12px; align-content:flex-start}
.bank{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding-top:6px}
.tok{padding:9px 14px; border-radius:13px; background:var(--surface); border:2px solid var(--line); box-shadow:0 3px 0 var(--line); font-weight:700; font-size:1.05rem; transition:transform .08s}
.tok:active{transform:translateY(3px); box-shadow:none}
.tok.used{background:var(--sunk); color:transparent; box-shadow:none; border-color:var(--sunk); pointer-events:none}
.flash{background:var(--surface); border:2px solid var(--line); border-radius:var(--r-lg); padding:26px 22px; display:flex; flex-direction:column; gap:12px; box-shadow:0 5px 0 var(--line)}
.flash .w{font-family:var(--f-display); font-weight:800; font-size:clamp(2rem, 8vw, 2.9rem); line-height:1.05; letter-spacing:-.03em}
.flash .tr{font-size:1.2rem; font-weight:700; color:var(--muted)}
.flash .nt{font-size:.95rem; color:var(--muted); font-weight:600; border-top:1px dashed var(--line-deep); padding-top:12px}
.flash .exl{font-size:1rem; font-weight:600}
.flash .exl em{display:block; color:var(--muted); font-style:normal; font-size:.9rem}
.conj{width:100%; border-collapse:collapse; font-size:1rem}
.conj td{padding:7px 4px; border-bottom:1px solid var(--line)}
.conj td:first-child{color:var(--muted); font-weight:600; width:48%}
.conj td:last-child{font-weight:800}
.conj tr.hl td{color:var(--cobalt)}
.cloze{font-family:var(--f-display); font-weight:700; font-size:clamp(1.35rem, 4.6vw, 1.8rem); line-height:1.35}
.cloze .gap{display:inline-block; min-width:90px; border-bottom:3px solid var(--cobalt); color:var(--cobalt); text-align:center; padding:0 6px}
.cloze-it{color:var(--muted); font-weight:600}
.wrongsent{font-family:var(--f-display); font-weight:700; font-size:1.4rem; text-decoration:underline wavy var(--bad); text-underline-offset:6px; text-decoration-thickness:2px}
.match{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.match .col{display:flex; flex-direction:column; gap:10px}
.match .opt{justify-content:center; text-align:center; min-height:58px; font-size:1rem}
.selfgrade{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.s-foot{border-top:2px solid var(--line); background:var(--bg); transition:background .2s}
.s-foot-in{max-width:640px; margin:0 auto; padding:16px max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:12px}
.s-foot.ok{background:var(--ok-soft); border-top-color:transparent}
.s-foot.bad{background:var(--bad-soft); border-top-color:transparent}
.s-foot.warn{background:var(--saffron-soft); border-top-color:transparent}
.fb{display:flex; gap:14px; align-items:flex-start; animation:pop .3s cubic-bezier(.2,.9,.25,1.3)}
@keyframes pop{from{transform:translateY(10px); opacity:0}}
.fb .badge{width:46px; height:46px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; color:#fff; background:var(--ok)}
.fb .badge svg{width:26px; height:26px}
.s-foot.bad .fb .badge{background:var(--bad)} .s-foot.warn .fb .badge{background:var(--saffron)}
.fb .h{font-family:var(--f-display); font-weight:800; font-size:1.35rem; color:var(--ok)}
.s-foot.bad .fb .h{color:var(--bad)} .s-foot.warn .fb .h{color:var(--saffron-deep)}
.fb .d{font-weight:600; margin-top:2px}
.fb .why{color:var(--muted); font-weight:600; font-size:.92rem; margin-top:4px}
.fb .src{font-size:.78rem; font-weight:800; color:var(--muted); margin-top:6px; letter-spacing:.03em}
.keys-hint{display:none; text-align:center; font-size:.78rem; color:var(--muted); font-weight:600}
@media (hover:hover) and (pointer:fine){.keys-hint{display:block}}

.done-screen{display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px; padding-top:20px}
.done-screen .big{font-family:var(--f-display); font-weight:800; font-size:clamp(2.2rem, 9vw, 3.2rem); line-height:1; color:var(--saffron-deep); letter-spacing:-.03em}
.done-tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%}
.done-tiles div{border:2px solid var(--line); border-radius:var(--r-md); padding:12px 8px; background:var(--surface)}
.done-tiles b{display:block; font-family:var(--f-display); font-size:1.6rem; font-weight:800}
.done-tiles span{font-size:.78rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.missed{width:100%; text-align:left}
.burst{width:120px; height:120px; color:var(--saffron)}
.burst g{transform-origin:60px 60px; animation:turn 14s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:90; background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:14px; font-weight:700; font-size:.92rem; box-shadow:var(--shadow); max-width:calc(100% - 32px); width:max-content; animation:toastIn .25s}
@keyframes toastIn{from{transform:translate(-50%, 10px); opacity:0}}
@media (min-width:900px){.toast{bottom:28px}}
.mode-note{font-size:.8rem; color:var(--muted); font-weight:600; margin-top:28px; text-align:center}


/* ---------- v3: training, units, generators ---------- */
.row-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.lesson-row .m.clamp{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.hint{color:var(--muted); font-size:.86rem; font-weight:600; margin:10px 0 0}
.muted{color:var(--muted)!important}
.train-strip{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
@media (max-width:560px){.train-strip{grid-template-columns:repeat(2, minmax(0,1fr))}}
.train-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px}
@media (max-width:480px){.train-grid{grid-template-columns:1fr 1fr}}
.train-tile{display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; padding:16px; box-shadow:0 4px 0 var(--line); transition:transform .1s, box-shadow .1s, border-color .12s}
.train-tile:hover{border-color:var(--line-deep)}
.train-tile:active{transform:translateY(4px); box-shadow:0 0 0 var(--line)}
.train-tile .tart{min-width:52px; padding:0 8px; height:52px; border-radius:15px; background:var(--cobalt-soft); color:var(--cobalt); display:grid; place-items:center; font-family:var(--f-display); font-size:.9rem; margin-bottom:8px; letter-spacing:-.02em; overflow:hidden; white-space:nowrap}
.train-tile .tart svg{width:40px; height:40px}
.train-tile .tart .clock{width:44px; height:44px; color:var(--ink)}
.train-tile .tt{font-family:var(--f-display); font-weight:800; font-size:1.08rem; line-height:1.15}
.train-tile .td{color:var(--muted); font-size:.86rem; font-weight:600; line-height:1.35}
.train-tile .tm{margin-top:auto; padding-top:6px; font-size:.74rem; font-weight:800; color:var(--saffron-deep); text-transform:uppercase; letter-spacing:.05em}
.train-tile.compact{padding:14px}
.train-tile.compact .tart{min-width:44px; height:44px; margin-bottom:4px}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:18px}
.wday{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:.72rem; font-weight:800; color:var(--muted); text-transform:uppercase}
.wday.today{color:var(--cobalt)}
.wbar{width:100%; max-width:34px; height:56px; border-radius:9px; background:var(--sunk); display:flex; align-items:flex-end; overflow:hidden}
.wbar span{display:block; width:100%; background:var(--saffron); border-radius:9px; min-height:0}
.wbar span.met{background:var(--ok)}
.mastery.sm{height:8px; margin:8px 0}
.unit{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); margin-top:10px; overflow:hidden}
.unit-head{display:flex; align-items:center; gap:10px; padding:10px 12px 10px 14px}
.unit-t{flex:1; min-width:0; text-align:left; display:grid; grid-template-columns:1fr auto; column-gap:10px; align-items:baseline}
.unit-t > span:first-child{font-family:var(--f-display); font-weight:700; font-size:1.02rem}
.unit-t .m{color:var(--muted); font-size:.8rem; font-weight:700}
.unit-t .mastery{grid-column:1 / -1; margin:8px 0 2px}
.unit.open .unit-head{border-bottom:1px solid var(--line)}
.unit-body{padding:14px; display:flex; flex-direction:column; gap:12px; background:var(--bg)}
.rule-card{background:var(--cobalt-soft); border-radius:var(--r-md); padding:14px 16px}
.rule-card b{font-family:var(--f-display); font-size:1.05rem; color:var(--cobalt)}
.rule-card p{margin:6px 0 0; font-weight:600; line-height:1.5}
.exlist{margin:10px 0 0; padding-left:18px; display:flex; flex-direction:column; gap:6px}
.exlist li{font-weight:700}
.exlist em{display:block; font-style:normal; color:var(--muted); font-weight:600; font-size:.88rem}
.say-inline{cursor:pointer}
.vtable{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden}
.vrow{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:9px 12px; border-bottom:1px solid var(--line); text-align:left}
.vrow:last-child{border-bottom:0}
.vrow:hover{background:var(--sunk)}
.vrow .es{font-weight:800}
.vrow .it{color:var(--muted); font-weight:600; font-size:.92rem}
.vrow small{display:block; font-size:.8rem; margin-top:2px; color:var(--muted); opacity:.85}
.verbs{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px}
.vcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px}
.vcard .vh b{font-family:var(--f-display); font-size:1.1rem}
.vcard .vh span{color:var(--muted); font-weight:600; font-size:.88rem}
.vcard .conj{font-size:.92rem; margin-top:6px}
.vcard .conj td{padding:4px 2px}
.vcard small{display:block; color:var(--muted); font-weight:600; margin-top:6px}
.rule-mini{margin-top:8px; padding:10px 12px; background:var(--surface); border-radius:12px; color:var(--ink); font-weight:600}
.rule-mini b{color:var(--cobalt)}
.errs s{color:var(--bad); text-decoration-thickness:2px}
.seg{display:flex; gap:6px; background:var(--sunk); padding:5px; border-radius:14px; flex-wrap:wrap}
.seg button{flex:1; min-height:42px; border-radius:10px; font-weight:800; color:var(--muted); padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--cobalt); box-shadow:var(--shadow)}
.clock-wrap,.scene-wrap{display:flex; justify-content:center}
.clock{width:min(62vw, 230px); height:auto; color:var(--ink)}
.scene{width:min(100%, 360px); height:auto}
.bignum{font-family:var(--f-display); font-weight:800; font-size:clamp(4rem, 22vw, 6.5rem); line-height:1; text-align:center; color:var(--cobalt); letter-spacing:-.04em; padding:6px 0}
.listen-row{display:flex; gap:12px; align-items:flex-end; justify-content:center; padding:10px 0}
.judging{display:flex; align-items:center; gap:12px; font-weight:700; color:var(--muted); padding:8px 0; min-height:52px}
.judging.sm{min-height:0; padding:4px 0; font-size:.9rem}
.spin{width:22px; height:22px; border-radius:50%; border:3px solid var(--line-deep); border-top-color:var(--cobalt); animation:spin .8s linear infinite; flex-shrink:0}
.explain{display:flex; gap:10px; align-items:flex-start; margin-top:10px; padding:10px 12px; background:var(--surface); border-radius:12px; font-weight:600; font-size:.94rem; line-height:1.45}
.explain svg{width:18px; height:18px; color:var(--cobalt); flex-shrink:0; margin-top:2px}
.btn.ghost svg{width:18px; height:18px; color:var(--cobalt)}
.newdot{display:inline-block; font-family:var(--f-ui); font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; background:var(--saffron); color:#2a1d00; padding:3px 8px; border-radius:7px; vertical-align:4px; margin-right:4px}
.owner{color:var(--muted); font-weight:600; font-size:.8em}
.flash.rule{background:var(--cobalt-soft); border-color:transparent; box-shadow:0 5px 0 color-mix(in srgb, var(--cobalt) 25%, transparent)}
.flash .w.sm{font-size:clamp(1.6rem, 6vw, 2.2rem); color:var(--cobalt)}
.rule-text{font-size:1.08rem; font-weight:600; line-height:1.55}
.flash.rule .nt{border-top-color:color-mix(in srgb, var(--cobalt) 30%, transparent)}
.flash.rule .exl{margin-top:6px; font-weight:700}
.cloze.q{font-size:clamp(1.2rem, 4.2vw, 1.55rem)}
.fb .d.said{color:var(--muted)}
.fb .d.said s{text-decoration-thickness:2px}
.word-detail .conj{margin-top:6px; color:var(--ink)}

/* ---------- v4: parla ---------- */
.tabs{grid-template-columns:repeat(5,1fr)}
.tab{font-size:.66rem; gap:3px; padding:2px 0}
.tab .ic{display:grid; place-items:center; width:56px; height:32px; border-radius:99px; transition:background .2s, transform .15s}
.tab[aria-current="page"] .ic{background:var(--cobalt-soft)}
.tab:active .ic{transform:scale(.9)}
.tab span:last-child{white-space:nowrap}
.rail .nav .ic{display:grid; place-items:center}
.mic-wrap{display:flex; flex-direction:column; align-items:center; gap:12px; padding:8px 0}
.mic{width:96px; height:96px; border-radius:50%; background:var(--bad); color:#fff; display:grid; place-items:center; box-shadow:0 5px 0 var(--bad-deep); transition:transform .08s, box-shadow .08s; position:relative}
.mic svg{width:44px; height:44px}
.mic:active{transform:translateY(5px); box-shadow:0 0 0 var(--bad-deep)}
.mic.on::before{content:""; position:absolute; inset:-10px; border-radius:50%; border:4px solid var(--bad); animation:ping 1.1s ease-out infinite}
@keyframes ping{from{transform:scale(.9); opacity:.7} to{transform:scale(1.3); opacity:0}}
.mic-l{font-weight:700; color:var(--muted); font-size:.92rem; text-align:center}
.heard{min-height:32px; font-family:var(--f-display); font-weight:700; font-size:1.3rem; line-height:1.4; display:flex; flex-wrap:wrap; gap:2px 8px}
.heard .hw-ok{color:var(--ok)}
.heard .hw-miss{color:var(--bad); text-decoration:underline wavy; text-underline-offset:5px; text-decoration-thickness:1.5px}
.heard .partial,.heard .raw{width:100%; color:var(--muted); font-family:var(--f-ui); font-size:.95rem; font-weight:600}
.say-tip{background:var(--saffron-soft); border-radius:var(--r-md); padding:12px 14px; font-weight:600; font-size:.94rem; line-height:1.45}
.conv-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px}
@media (max-width:480px){.conv-grid{grid-template-columns:1fr}}
.conv-card{display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; padding:16px; box-shadow:0 4px 0 var(--line); transition:transform .1s, box-shadow .1s, border-color .12s}
.conv-card:hover{border-color:var(--line-deep)}
.conv-card:active{transform:translateY(4px); box-shadow:0 0 0 var(--line)}
.conv-card .ct{font-family:var(--f-display); font-weight:800; font-size:1.1rem; line-height:1.2; margin-top:6px}
.conv-card .cd{color:var(--muted); font-weight:600; font-size:.88rem; line-height:1.35}
.conv-card[disabled]{opacity:.55; cursor:not-allowed; transform:none}
.c-title{flex:1; min-width:0}
.c-title b{display:block; font-family:var(--f-display); font-size:1.1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ============================================================
   Il materiale del tutor, trascritto con l'ortografia corretta.
   Formato riga per riga:
     @L id | etichetta | titolo | sottotitolo
     # unità
     es | it | nota                 vocabolo
     ~ es | it | nota               espressione
     V inf | it | forme o @regola | nota      verbo, presente
     VI inf | it | forme o @imp | nota        verbo, imperfetto
     G titolo | spiegazione         regola (gli esercizi sotto le appartengono)
     ? frase con {giusta|sbagliata|…} | traduzione | perché
     Q domanda | giusta ; sbagliata ; … | perché
     > italiano | spagnolo / alternativa | perché
     = spagnolo | italiano          frase da comporre
     ! sbagliata | corretta | perché
     * generatore | titolo | descrizione
   ============================================================ */
const CURRICULUM = String.raw`
@L L1 | L1 | Datos personales | Saluti, nazionalità, articoli, plurale, numeri 0–10, ser e il presente regolare

# Saludos y despedidas
~ hola | ciao
~ buenos días | buongiorno | Si usa fino all'ora di pranzo (13:00 circa).
~ buenas tardes | buon pomeriggio | Dalle 14:00 alle 20:00 circa.
~ buenas noches | buonasera / buonanotte | Dalle 21:00 in poi.
~ adiós | arrivederci, addio
~ hasta luego | a dopo, arrivederci
~ chao | ciao (salutando)
~ encantado / encantada | piacere (conoscendo qualcuno) | Encantado lo dice un uomo, encantada una donna.
~ mucho gusto | molto piacere
~ ¿puedes repetir, por favor? | puoi ripetere, per favore?
~ gracias | grazie
~ muchas gracias | grazie mille
~ ¿qué es esto? | che cos'è questo?
~ esto es un bolígrafo | questa è una penna

# En clase
el bolígrafo | la penna (da scrivere)
la hoja de papel | il foglio di carta
el teclado | la tastiera
el ordenador | il computer | In Spagna si dice ordenador.
la pantalla | lo schermo | In spagnolo è femminile: la pantalla.

# Nacionalidades
español / española | spagnolo / spagnola | España
italiano / italiana | italiano / italiana | Italia
francés / francesa | francese | Francia
inglés / inglesa | inglese | Inglaterra o Gran Bretaña
alemán / alemana | tedesco / tedesca | Alemania
portugués / portuguesa | portoghese | Portugal
ruso / rusa | russo / russa | Rusia
japonés / japonesa | giapponese | Japón
chino / china | cinese | China
estadounidense | statunitense | Uguale al maschile e al femminile. Estados Unidos.
marroquí | marocchino / marocchina | Uguale al maschile e al femminile. Marruecos.
~ ¿quién es? | chi è?
~ ¿quiénes son? | chi sono?
~ ¿de dónde es? | di dov'è?
~ ¿de dónde son? | di dove sono?
~ ¿cuál es tu nombre? | qual è il tuo nome?
~ ¿cuál es tu apellido? | qual è il tuo cognome?
~ ¿cuál es tu nacionalidad? | qual è la tua nazionalità?

# Datos personales
~ mi nombre es | il mio nome è
~ mi apellido es | il mio cognome è
~ soy de nacionalidad | sono di nazionalità
~ mi teléfono fijo es | il mio telefono fisso è
~ mi teléfono móvil es | il mio cellulare è
~ mi dirección es | il mio indirizzo è
~ vivo en la calle | vivo in via
~ mi correo electrónico es | il mio indirizzo email è
~ mi código postal es | il mio codice postale è
la arroba | la chiocciola (@)
G Presentarsi | Le frasi della presentazione di Juan, la scheda della lezione 1.
> Ciao, mi chiamo Juan. | Hola, me llamo Juan.
> Il mio cognome è Hernández. | Mi apellido es Hernández.
> Sono spagnolo, di Madrid. | Soy español, de Madrid.
> Parlo spagnolo e francese. | Hablo español y francés.
> Imparo l'inglese all'università. | Aprendo inglés en la universidad. / Aprendo el inglés en la universidad.
> Vivo in Italia. | Vivo en Italia.
> Questo è il mio amico Pablo. | Este es mi amigo Pablo.
> Questa è la mia amica Philia. | Esta es mi amiga Philia.
= Hola, me llamo Juan y soy de Madrid | Ciao, mi chiamo Juan e sono di Madrid
= Mi teléfono móvil es tres tres cuatro | Il mio cellulare è tre tre quattro

# Verbos
V ser | essere | soy,eres,es,somos,sois,son | Irregolare.
V hablar | parlare | @reg | Modello dei verbi in -AR.
V aprender | imparare | @reg | Modello dei verbi in -ER.
V vivir | vivere, abitare | @reg | Modello dei verbi in -IR.
V llamarse | chiamarsi | @reg | Riflessivo: me, te, se, nos, os, se.
G Usted e ustedes | Usted (Ud./Vd.) è il «Lei» di cortesia e usa la 3ª persona singolare. Ustedes (Uds./Vds.) è il plurale di cortesia e usa la 3ª persona plurale.
? ¿Usted {es|eres|sois} italiano? | Lei è italiano? | Usted → 3ª persona singolare.
? ¿Ustedes {hablan|habláis|hablamos} español? | Voi (cortesia) parlate spagnolo? | Ustedes → 3ª persona plurale.
? ¿Cómo se {llama|llamas|llaman} usted? | Come si chiama Lei? | Usted → 3ª persona singolare.
? ¿Dónde {viven|vivís|vive} ustedes? | Dove abitate (cortesia)? | Ustedes → 3ª persona plurale.
? Vosotros {sois|son|somos} italianos | Voi siete italiani | Vosotros (voi, informale) → sois.
? Yo {me llamo|se llama|me llama} Paloma | Io mi chiamo Paloma
? Nosotros {aprendemos|aprendimos|aprendamos} español | Noi impariamo lo spagnolo | -ER: aprend-emos.

# Sobre, encima de, en, arriba
G Sobre | Sopra, appoggiato sulla superficie. Non vuole avverbi o preposizioni vicino: non si dice «muy sobre» né «más sobre».
? El libro está {sobre|arriba|muy sobre} la mesa | Il libro è sul tavolo | Appoggiato sulla superficie → sobre (o en, encima de).
? Hay un teléfono {sobre|arriba} la mesilla | C'è un telefono sul comodino
G En | Indica il luogo in generale, ma anche l'interno di una cosa: pon la lasaña en el horno (dentro il forno).
? Pon la lasaña {en|sobre|encima del} horno | Metti la lasagna nel forno | Dentro → en.
? El libro está {en|dentro} la mesa | Il libro è sul tavolo | Luogo generico → en.
G Encima de | Stesso significato di sobre, ma può avere vicino avverbi (muy encima de) e preposizioni (con… encima). Si può usare sempre.
? Hay un cuadro muy {encima de|sobre} la cama | C'è un quadro molto sopra il letto | Con un avverbio: encima de, non sobre.
? Una mesa con una estatua {encima|sobre|arriba de} | Un tavolino con sopra una statua | Con… + cosa + encima.
G Arriba | In alto, su. Può avere vicino avverbi e la preposizione de. Si può sostituire a volte con encima, mai con sobre.
? El piso de {arriba|sobre|encima} | Il piano di sopra | In alto → arriba.
? En la parte de {arriba|sobre} del armario hay un teléfono viejo | Nella parte alta dell'armadio c'è un telefono vecchio
? {Arriba|Sobre}, en el armario, hay un teléfono viejo | Su, nell'armadio, c'è un telefono vecchio
? Más {arriba|sobre} de la mesa hay un cuadro | Più in alto del tavolo c'è un quadro | Con más → arriba.

# Nexos
~ pero | ma
~ sino | ma (correzione: non questo, ma quest'altro) | Dopo una negazione, per correggere: no esto sino esto otro.
~ sin embargo | però, tuttavia | All'inizio della frase vuole la virgola dopo; in mezzo va tra due virgole.
~ por el contrario / por otro lado | invece, d'altra parte
~ en lugar de | invece di, al posto di
~ de todas maneras | comunque, in ogni modo
~ por otra parte | d'altra parte
~ por último | infine
~ por fin | finalmente (con soddisfazione)
~ finalmente | finalmente (neutro)
~ al final | alla fine
~ la finalidad | il fine, lo scopo
~ el fin / el final | la fine | El fin del mundo, el final de la película.
~ en fin / en resumen | insomma
~ de hecho | infatti
~ ¡claro! / ¡efectivamente! / ¡por supuesto! | infatti! (esclamazione), certo!
~ ahora ya | ormai
~ ya no | non più
~ aunque | anche se
~ como | siccome | All'inizio della frase.
~ además | inoltre
G Pero o sino | PERO = ma (aggiunge). SINO = ma, dopo una negazione, per correggere: no esto sino esto otro.
? Me gusta el tenis {pero|sino} no el fútbol | Mi piace il tennis ma non il calcio | Aggiunge un'informazione → pero.
? No me gusta el tenis {pero|sino} me gusta el fútbol | Non mi piace il tennis ma mi piace il calcio | C'è un nuovo verbo: pero.
? No me gusta el tenis {sino|pero} el fútbol | Non mi piace il tennis ma il calcio | Correzione dopo una negazione → sino.
? No vivo en Roma {sino|pero} en Velletri | Non abito a Roma ma a Velletri | Correzione → sino.
G I connettivi del tutor | Sin embargo, en lugar de, de todas maneras, por último, por fin, al final, en fin, de hecho, ahora ya, ya no, aunque, como, además.
? Hoy como lasaña {en lugar del|por el contrario} arroz de siempre | Oggi mangio la lasagna invece del solito riso | Al posto di → en lugar de.
? Un apartamento en Roma es bonito; {de todas maneras|además}, yo prefiero vivir en Velletri | Un appartamento a Roma è bello; comunque preferisco vivere a Velletri
? He lavado, he planchado y {por último|por fin|en fin} he cocinado | Ho lavato, stirato e infine ho cucinato | L'ultima di una serie → por último.
? {Por fin|Al final|Por último} he terminado el trabajo | Finalmente ho finito il lavoro | Con soddisfazione → por fin.
? {Al final|Por fin|Por último} he hecho lo que me ha dicho Luis | Alla fine ho fatto quello che mi ha detto Luis | Alla fine → al final.
? Me he perdido el {final|fin|finalidad} de la película | Mi sono perso la fine del film | La fine di un film → el final.
? Parece el {fin|final|finalidad} del mundo | Sembra la fine del mondo
? La {finalidad|final|fin} de este trabajo es satisfacer al cliente | Lo scopo di questo lavoro è soddisfare il cliente | Lo scopo → la finalidad.
? He aprobado el examen; {en fin|de hecho|además}, he sacado un 30 | Ho passato l'esame; insomma, ho preso 30 | Insomma → en fin.
? Hoy no estoy bien. {De hecho|En fin|Además}, no he ido a la universidad | Oggi non sto bene. Infatti non sono andato all'università | Infatti → de hecho.
? {Ahora ya|Ya no} es tarde para ir al cine | Ormai è tardi per andare al cinema | Ormai → ahora ya.
? {Ya no|Ahora ya|Todavía} voy a jugar al tenis | Non vado più a giocare a tennis | Non più → ya no.
? {Ya no|Ahora ya} existen los hombres de antes | Non ci sono più gli uomini di una volta | Non più → ya no.
? {Aunque|Como|Además} trabaja mucho, gana poco | Anche se lavora molto, guadagna poco | Anche se → aunque.
? {Como|Aunque|Además} mi padre no trabaja, nos vamos a la playa | Siccome mio padre non lavora, andiamo al mare | Siccome → como.
? Elena es una buena estudiante y {además|aunque|como} una óptima nadadora | Elena è una brava studentessa e inoltre un'ottima nuotatrice | Inoltre → además.
? —Estás trabajando mucho. Te vas a cansar. —¡{Claro|De hecho|En fin}! | —Stai lavorando troppo. Ti stancherai. —Infatti! | Infatti esclamativo → ¡claro! / ¡efectivamente!
> Mi piacciono le persone lavoratrici; invece non sopporto i pigri. | Me gustan las personas trabajadoras; sin embargo, no soporto a los vagos. / Me gustan las personas trabajadoras, sin embargo, no soporto a los vagos.

# Indefinidos
~ algo | qualcosa | Solo per cose.
~ nada | niente | Solo per cose.
~ alguien | qualcuno (chiunque) | Solo per persone, quando non importa chi.
~ nadie | nessuno (nessuna persona) | Solo per persone.
~ alguno / alguna / algunos / algunas | qualche, qualcuno (di un gruppo) | Persone e cose. Davanti a un nome maschile: algún.
~ ninguno / ninguna | nessuno / nessuna | Persone e cose. Davanti a un nome maschile: ningún.
~ cualquier / cualquiera | qualsiasi, qualunque, chiunque | Cualquier davanti al nome; cualquiera dopo il nome o da solo.
~ todo / toda / todos / todas | tutto / tutta / tutti / tutte
~ los dos / las dos | tutti e due / tutte e due
~ bastante / bastantes | abbastanza
~ demasiado / demasiada / demasiados / demasiadas | troppo / troppa / troppi / troppe
~ poco / poca / pocos / pocas | poco / poca / pochi / poche
G Algo, alguien, alguno | ALGO / NADA per le cose. ALGUIEN / NADIE per le persone. ALGUNO / NINGUNO per persone e cose (algún, ningún davanti a un nome maschile).
? ¿Hay {algo|alguien|alguno} en la nevera? | C'è qualcosa in frigo? | Cosa → algo.
? No, no hay {nada|nadie|ninguno} | No, non c'è niente | Cosa → nada.
? ¿Hay {alguien|algo|alguno} en el baño? | C'è qualcuno in bagno? | Persona → alguien.
? No, no hay {nadie|nada|ningún} | No, non c'è nessuno | Persona → nadie.
? ¿Tienes {algún|alguno|algo} bolígrafo rojo? | Hai qualche penna rossa? | Davanti al nome maschile → algún.
? No, no tengo {ningún|ninguno|nada} bolígrafo rojo | No, non ho nessuna penna rossa | Davanti al nome maschile → ningún.
? ¿Hay algún cine por aquí? No, no hay {ninguno|ningún|nadie} | C'è qualche cinema da queste parti? No, non ce n'è nessuno | Senza nome dopo → ninguno.
G Otro, los otros, los demás | L'altro = el otro. Un altro = otro (mai «un otro»!). Gli altri (il resto) = los demás. Gli altri (quelli diversi da questi) = los otros. …e altro = …y demás.
? Explicaré el imperativo {otro|un otro|el otro} día | Spiegherò l'imperativo un altro giorno | Un altro → otro, senza un.
? {El otro|Otro|Un otro} día fui a Roma | L'altro giorno sono andata a Roma | L'altro → el otro.
? Marcos se quedó en casa, pero {los demás|los otros|otros} se fueron al cine | Marco rimase a casa ma gli altri andarono al cinema | Il resto del gruppo → los demás.
? Estos libros los pones aquí; los {otros|demás} allí | Questi libri li metti qui, gli altri là | Quelli diversi da questi → los otros.
? Merluza, lenguado, mero y {demás|otros|otro} | Merluzzo, sogliola, cernia e altro | …e altro → y demás.
G Cualquier o cualquiera | Cualquier davanti al nome (cualquier cuaderno, cualquier casa). Cualquiera dopo il nome o da solo (una casa cualquiera; cualquiera puede hacerlo).
? Necesito {cualquier|cualquiera} cuaderno | Mi serve un quaderno qualsiasi | Davanti al nome → cualquier.
? Es una casa {cualquiera|cualquier} | È una casa qualunque | Dopo il nome → cualquiera.
? {Cualquiera|Cualquier} puede hacerlo | Chiunque può farlo | Da solo → cualquiera.
G Ne e ci | In spagnolo «ne» e «ci» non esistono: semplicemente non si mettono.
> Hai qualche libro d'avventura? Sì, ne ho molti. | ¿Tienes algún libro de aventuras? Sí, tengo muchos.
> Vai al cinema? Sì, ci vado. | ¿Vas al cine? Sí, voy.

# Ser y estar
G Usi di SER | Dati personali: identità (soy Luis), origine (soy español), professione (soy mecánico), credo (soy católico). Possesso (es mi casa). Materia (es de madera). Giorno e ora (hoy es martes; son las tres). «Aver luogo» (la conferencia es en el aula magna). Prezzo (¿cuánto es?).
G Usi di ESTAR | Stato civile e senza lavoro (estoy casado, estoy jubilado). Quanti ne abbiamo (¿a cuántos estamos?). Con il participio (está abierto). Lavoro temporaneo (está de camarero). Stato temporaneo, «essere diventato» (está gordísimo). Posizione (Luis está en Lisboa). Stato fisico (estoy bien). Con il gerundio (estoy trabajando). «Rimanere, passare un periodo» (pienso estar unos días en la playa).
? {Soy|Estoy} Luis | Sono Luis | Identità → ser.
? {Soy|Estoy} español | Sono spagnolo | Origine → ser.
? {Soy|Estoy} mecánico | Faccio il meccanico | Professione → ser.
? {Estoy|Soy} casado | Sono sposato | Stato civile → estar (nella scheda del tutor).
? {Estoy|Soy} jubilado | Sono in pensione | Senza lavoro → estar.
? Mi casa {es|está} de madera | La mia casa è di legno | Materia → ser.
? Hoy {es|está} martes | Oggi è martedì | Giorno → ser.
? {Son|Están} las tres | Sono le tre | Ora → ser.
? La conferencia {es|está} en el aula magna | La conferenza si tiene in aula magna | Un evento che ha luogo → ser.
? ¿Cuánto {es|está}? Son tres euros | Quant'è? Sono tre euro | Prezzo → ser.
? {Es|Está} mi casa | È casa mia | Possesso → ser.
? La tienda {está|es} abierta | Il negozio è aperto | Con il participio → estar.
? Julio {está|es} de camarero en un bar | Julio fa il cameriere in un bar (per ora) | Lavoro temporaneo → estar de.
? Últimamente {está|es} gordísimo | Ultimamente è ingrassatissimo | Stato temporaneo → estar.
? Las manzanas {están|son} verdes | Le mele sono acerbe | Stato (non ancora mature) → estar.
? Luis {está|es} en Lisboa | Luis è a Lisbona | Posizione → estar.
? Hoy {estoy|soy} muy bien | Oggi sto molto bene | Stato fisico → estar.
? {Estoy|Soy} trabajando | Sto lavorando | Con il gerundio → estar.
? ¿A cuántos {estamos|somos} hoy? | Quanti ne abbiamo oggi?
? Pienso {estar|ser} unos días en la playa | Penso di passare qualche giorno al mare | «Rimanere» → estar.

G Aggettivi che cambiano significato | Con SER indicano com'è qualcosa; con ESTAR come si trova. Listo, aburrido, bueno, malo, rico, atento, vivo, parado, delicado.
? ¿{Estás|Eres} listo? Nos vamos | Sei pronto? Andiamo | Pronto → estar listo.

# Muy y mucho

# Ir y venir, llevar y traer
G Ir o venir | IR se chi parla si sposta (o va dove non si trova): ¿a qué hora voy a tu casa? VENIR se chi parla resta dove si trova: ¿a qué hora vienes a casa?

# Pedir y preguntar
G Pedir o preguntar | PEDIR = chiedere per AVERE (la cuenta, perdón, información). PREGUNTAR = chiedere per SAPERE (dónde está la plaza; la lección).

const loaded = {};
function loadScript(src){ return loaded[src] ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Non riesco a caricare il lettore di documenti. Controlla la connessione.')); document.head.appendChild(s); }); }
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function readPdf(file, imgBudget, images){
  await loadScript(PDFJS + 'pdf.min.js'); await loadScript(PDFJS + 'pdf.worker.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  const out = [];
  for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
    const page = await doc.getPage(p), tc = await page.getTextContent();
    const rows = [];
    for (const it of tc.items) {
      if (!it.str?.trim()) continue;
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 3); if (!row) rows.push(row = {y, cells:[]});
      row.cells.push({x, w:it.width, s:it.str});
    }
    rows.sort((a,b) => b.y - a.y);
    const lines = rows.map(r => { r.cells.sort((a,b) => a.x - b.x); let s = '', end = null; for (const c of r.cells) { if (end !== null) s += (c.x - end > 14 ? ' | ' : (c.x - end > 1.5 ? ' ' : '')); s += c.s; end = c.x + c.w; } return s.trim(); });
    out.push(`[${file.name} · pagina ${p}]\n` + lines.join('\n'));
    if (images.length < imgBudget) {
      const v1 = page.getViewport({scale:1}), scale = Math.min(2, 1400 / v1.width), vp = page.getViewport({scale});
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .82)); if (blob) images.push(blob);
    }
  }
  return out.join('\n\n');
}
async function readDocx(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
  const {value} = await mammoth.convertToHtml({arrayBuffer: await file.arrayBuffer()});
  const dom = new DOMParser().parseFromString(value, 'text/html');
  const out = [];
  const walk = el => { for (const n of el.children) {
    const t = n.tagName;
    if (/^H[1-6]$/.test(t)) out.push('#'.repeat(+t[1]) + ' ' + n.textContent.trim());
    else if (t === 'TABLE') { out.push('[tabella]'); n.querySelectorAll('tr').forEach(tr => out.push('| ' + [...tr.children].map(td => td.textContent.trim().replace(/\s+/g,' ')).join(' | ') + ' |')); out.push(''); }
    else if (t === 'UL' || t === 'OL') n.querySelectorAll(':scope > li').forEach(li => out.push('- ' + li.textContent.trim()));
    else if (n.textContent.trim()) out.push(n.textContent.trim());
  } };
  walk(dom.body);
  return `[${file.name}]\n` + out.join('\n');
}

async function analyze(){
  imp.step = 'work'; imp.stage = 0; imp.live = 0; importSheet();
  const ctl = imp.ctl = new AbortController();
  try {
    sampleLimits ||= await sampleFn.limits().catch(() => null);
    const imgBudget = Math.min(6, sampleLimits?.images?.maxCount || 0);
    const images = [], parts = [];
    for (const f of imp.files) {
      const e = extOf(f);
      if (e === 'pdf') parts.push(await readPdf(f, imgBudget, images));
      else if (e === 'docx') parts.push(await readDocx(f));
      else if (e === 'txt') parts.push(`[${f.name}]\n` + await f.text());

function cleanResult(r){
  const seen = new Map(); const lm = lessonMap();
  items().forEach(i => seen.set(bare(i.es), lm[i.lessonId]?.label === '✦' ? 'scheda «' + lm[i.lessonId].title + '»' : 'lezione ' + lm[i.lessonId]?.label));
  const list = (Array.isArray(r?.items) ? r.items : []).filter(i => i && KIND[i.kind] && i.es && i.it).map(i => {
    const it = {kind:i.kind, es:String(i.es).trim(), it:String(i.it).trim(), note:i.note ? String(i.note) : '', ex:Array.isArray(i.ex) ? i.ex.filter(e => e?.es).slice(0,3) : [],
      drills:Array.isArray(i.drills) ? i.drills.filter(validDrill).slice(0,6) : []};
    if (i.kind === 'verb' && i.forms && typeof i.forms === 'object') it.forms = Object.fromEntries(['tense',...PERSONS].filter(k => i.forms[k]).map(k => [k, String(i.forms[k])]));
    const dup = seen.get(bare(it.es)); it.dup = dup || null; it.keep = !dup;

  return {title:String(r?.title || 'Lezione').slice(0,60), summary:String(r?.summary || ''), topics:Array.isArray(r?.topics) ? r.topics.slice(0,4).map(String) : [], items:list};

function validDrill(d){

function heardWords(s){ return bare(s).split(' ').filter(Boolean).flatMap(w => /^\d+$/.test(w) && +w <= 100 ? bare(numEs(+w)).split(' ') : [w]); }

  const tw = cleanEs(target).split(/\s+/).map(w => ({w, b:bare(w).replace(/ /g,'')})).filter(x => x.b);
  const hw = heardWords(heard), same = (a, b) => a === b || (a.length >= 5 && lev(a, b) <= 1);

  const T = Tk; if (!T || T.kind !== 'say' || T.state === 'shown') return;

function judgeSay(cands){
  const T = Tk, q = T.queue[T.i];
  const res = cands.filter(Boolean).map(c => scoreSay(q.es, c)).sort((a, b) => b.pct - a.pct)[0] || scoreSay(q.es, '');
  const r = res.pct >= .85 ? 'ok' : res.pct >= .5 ? 'warn' : 'bad';
  if (!T.tries) T.xp += r === 'ok' ? 10 : r === 'warn' ? 6 : 2;
  T.tries++;
  const prev = T.best.get(T.i); if (!prev || res.pct > prev.pct) T.best.set(T.i, {...res, q});
  $('#heard').innerHTML = res.words.map(w => `<span class="${w.ok ? 'hw-ok' : 'hw-miss'}">${esc(w.w)}</span>`).join('') + `<span class="raw">Ho capito: «${esc(res.heard)}»</span>`;
  const lab = $('#mic-l'); if (lab) lab.textContent = 'Tocca Riprova per rileggerla';

  const f = $('#sfoot'); f.className = 's-foot ' + r;
  f.innerHTML = `<div class="s-foot-in"><div class="fb"><span class="badge">${r === 'ok' ? ICON.check : r === 'warn' ? ICON.warn : ICON.x}</span><div style="min-width:0;flex:1">
      <div class="h">${r === 'ok' ? pickOne(['¡Perfecto!','¡Muy bien dicho!','¡Se te entiende!']) : r === 'warn' ? '¡Casi!' : 'Ancora una volta'}</div>
      <div class="d">${Math.round(res.pct*100)}% delle parole riconosciute</div>
      ${miss.length ? `<div class="why">Riascolta e ripeti: <b>${esc(miss.join(', '))}</b></div>` : ''}
      ${r !== 'ok' && T.snd ? `<div class="why">${esc(T.snd.tip)}</div>` : ''}</div></div>
    <div style="display:flex;gap:10px"><button class="btn ghost" data-action="say-retry">Riprova</button><button class="btn wide ${r === 'bad' ? 'bad' : 'ok'}" style="flex:1" id="cont" data-action="say-next">Continua</button></div></div>`;
  tone(r === 'bad' ? 'bad' : 'ok');
  T.state = 'shown';
}
function sayRetry(){
  const T = Tk; T.state = 'ask'; sayFootAsk();

function convVocab(c){
  const order = BUILT.lessons.map(l => l.id), upto = c.lesson ? order.indexOf(c.lesson) : order.length - 1;
  const ok = new Set(order.slice(0, upto + 1)), all = items().filter(i => ok.has(i.lessonId));
  const words = i => i.kind === 'vocab' || i.kind === 'phrase';
  const main = all.filter(i => words(i) && i.lessonId === c.lesson), rest = shuffle(all.filter(i => words(i) && i.lessonId !== c.lesson));
  const voc = [...main, ...rest].slice(0, 260).map(i => firstVar(i.es)).join('; ');
  const verbs = [...new Set(all.filter(i => i.kind === 'verb').map(i => i.es))].join(', ');
  const rules = Object.values(RULES).filter(r => ok.has(r.lessonId)).map(r => r.title).join('; ');
  return {voc, verbs, rules};
}

async function convTurn(said){
  const T = Tk;
  T.busy = true;
  if (said) { T.pending = {who:'me', text:said, state:'checking'}; T.msgs.push(T.pending); T.turns++; }
  T.showHints = false; renderConv(); convHints(); convSendState();
  try {
    const res = await sampleFn.json(convPrompt(T, said), {modelTier:'default', signal:T.ctl.signal, cache:false});
    if (Tk !== T) return;
    const me = T.pending;
    if (me) {
      const fix = String(res?.fix || '').trim();
      if (fix && norm(fix) !== norm(said)) {
        me.fix = fix; me.note = String(res?.note || '').trim();
        me.state = bare(fix) === bare(said) ? 'minor' : 'fix';
        if (me.state === 'fix') saveConvFix(said, fix, me.note, T.c);
      } else me.state = 'ok';
      T.xp += me.state === 'ok' ? 5 : 3;
    }
    T.pending = null;
    const reply = String(res?.reply || '').trim();
    if (reply) { T.msgs.push({who:'bot', es:reply, it:String(res?.it || '').trim()}); speak(reply); }
    T.hints = (Array.isArray(res?.hints) ? res.hints : []).filter(h => typeof h === 'string' && h.trim()).slice(0, 3);
    T.done = !!res?.done || T.turns >= 12;

    if (Tk !== T || e?.code === 'cancelled' || T.ctl.signal.aborted) return;
    if (T.pending) { T.msgs.pop(); T.turns--; const ta = $('#c-in'); if (ta && !ta.value) ta.value = said; T.pending = null; }
    toast(ERR_COPY[e?.code] || 'Claude non risponde in questo momento. Riprova.');
    if (!T.msgs.length) { T.busy = false; return quitTalk(); }

  return `<button class="card conv-card" data-action="conv-start" data-arg="${c.id}" ${sampleFn ? '' : 'disabled'}><span class="pill ${c.lesson ? '' : 'ex'}">${esc(l ? l.label + ' · ' + l.title : 'Tutto il materiale')}</span><span class="ct">${esc(c.t)}</span><span class="cd">${esc(c.d)}</span></button>`;
}
function renderPractice(){
  return `<div class="page-head"><div class="eyebrow">Allenamento libero</div><h1>Pratica</h1><p>Esercizi mirati, pronuncia e conversazione. Tutto quello che fai qui conta anche per il ripasso.</p></div>
    <div class="section-title" style="margin-top:6px"><h3>Esercizi mirati</h3></div>
    <div class="train-grid">${TRAIN_ORDER.map(k => trainTile(k)).join('')}</div>
    <div class="section-title"><h3>Pronuncia</h3><span class="eyebrow">${canListen() ? 'con il microfono' : 'con la dettatura'}</span></div>
    <div class="card say-panel">
      <button class="say-main" data-action="say-start" data-arg="rep"><span class="t-art gr">${ICON.mic}</span><span class="t-txt"><b>Leggi ad alta voce</b><span>10 frasi delle tue lezioni. Vedi parola per parola cosa capisce uno spagnolo.</span></span>${ICON.chev}</button>
      <div class="eyebrow" style="margin:16px 0 8px">Suoni difficili per un italiano</div>
      <div class="sound-chips">${SOUNDS.map(x => `<button class="sound-chip" data-action="say-start" data-arg="${x.k}"><b>${esc(x.art)}</b><span>${esc(x.t)}</span></button>`).join('')}</div>
    </div>
    ${SR ? '' : `<div class="notice">${esc('Questo browser non ha il riconoscimento vocale integrato: potrai leggere la frase con la dettatura. ' + DICT_TIP)}</div>`}
    <div class="section-title"><h3>Conversazioni</h3><span class="eyebrow">con Claude</span></div>
    ${sampleFn ? '' : `<div class="notice" style="margin:0 0 12px">Le conversazioni usano Claude: apri Repaso da claude.ai con il tuo account.</div>`}
    <div class="conv-grid">${CONV.map(convCard).join('')}</div>
    <p class="hint">Claude usa solo il vocabolario e i tempi verbali delle lezioni fino a quella della conversazione. Ogni tua frase viene corretta, e gli errori tornano nel ripasso.</p>
    ${modeNote()}`;
}

for (const g of GRAMMAR) g.ruleIds = g.rules.map(r => { const [lid, title] = r.split('|'); return Object.values(RULES).find(x => x.lessonId === lid && x.title === title)?.id; }).filter(Boolean);

}

    const n = gramItems(g).length;
    body = `<div class="done-screen"><div class="seal" aria-hidden="true">${esc(g.art)}</div><div class="big">¡Regla descubierta!</div>
      <p class="lead" style="text-align:center">Adesso fissala con gli esercizi del tutor su questo argomento (${n}). Poi torneranno nel ripasso quando starai per dimenticarli.</p></div>`;
    foot = `<div style="display:flex;gap:10px"><button class="btn ghost" data-action="talk-quit">Più tardi</button><button class="btn" style="flex:1" id="cont" data-action="gram-practice" data-id="${g.id}">Esercitati ora</button></div>`;
  }
  $('#sbody').innerHTML = `<div class="s-inner"><div class="s-kicker"><span class="k"><span class="step-n">${ph[0]}</span>${ph[1]}</span><span class="pill">${esc(g.t)}</span></div>${body}</div>`;
  $('#sbody').scrollTop = 0;
  const f = $('#sfoot'); f.className = 's-foot'; f.innerHTML = `<div class="s-foot-in">${foot}</div>`;
}
function gramSelect(i){
  const T = Tk; if (T.state !== 'ask') return;
  const btns = document.querySelectorAll('.opt[data-opt]'); if (!btns[i]) return;
  T.sel = i; btns.forEach((b, j) => b.setAttribute('aria-pressed', j === i)); haptic('tap');
  $('#check').disabled = false;
}
function gramCheck(){
  const T = Tk; if (T.state !== 'ask' || T.sel == null) return;
  const right = T.opts[T.sel] === T.q.o[0], disc = T.steps[T.i] === 'disc';
  document.querySelectorAll('.opt[data-opt]').forEach((b, i) => { if (T.opts[i] === T.q.o[0]) b.classList.add('right'); else if (i === T.sel) b.classList.add('wrong'); });
  T.xp += right ? 5 : 1; $('#sxp').textContent = T.xp + ' XP';
  const r = right ? 'ok' : disc ? 'warn' : 'bad';
  const f = $('#sfoot'); f.className = 's-foot ' + r;
  f.innerHTML = `<div class="s-foot-in"><div class="fb"><span class="badge">${right ? ICON.check : disc ? ICON.warn : ICON.x}</span><div style="min-width:0;flex:1">
    <div class="h">${right ? pickOne(disc ? ['¡Lo has descubierto!','¡Exacto!'] : ['¡Exacto!','¡Eso es!']) : disc ? 'Quasi: guarda di nuovo' : 'Non proprio'}</div>
    ${right ? '' : `<div class="d">La risposta: <b>${esc(T.q.o[0])}</b></div>`}<div class="why">${esc(T.q.why)}</div></div></div>
    <button class="btn wide ${right ? 'ok' : disc ? '' : 'bad'}" id="cont" data-action="gram-next">Continua</button></div>`;
  tone(right ? 'ok' : 'bad');
  T.state = 'shown';
}

/* ---------------- event wiring ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-scrim], [data-action]');
  if (!t) return;
  if (t.dataset.scrim !== undefined && e.target === t) return closeSheet();
  if (t.dataset.go) { closeSheet(); return go(t.dataset.go); }
  if (t.dataset.filter) { bookFilter = t.dataset.filter; bookLimit = 120; return render(); }
  if (t.dataset.opt !== undefined) return selectOpt(+t.dataset.opt);
  if (t.dataset.tok !== undefined) return tapToken(+t.dataset.tok, false);
  if (t.dataset.lane !== undefined) return tapToken(+t.dataset.lane, true);
  if (t.dataset.m) return tapMatch(t);
  if (t.dataset.accent) { e.preventDefault(); return insertAccent(t.dataset.accent); }
  const a = t.dataset.action; if (!a) return;
  switch (a) {
    case 'import': resetImport(); return importSheet();
    case 'close': return closeSheet();
    case 'settings': return settingsSheet();
    case 'set': { const k = t.dataset.k, raw = t.dataset.v, v = raw === 'true' ? true : raw === 'false' ? false : +raw; saveProfile({[k]:v}); settingsSheet(); return render(); }
    case 'show-paste': imp.showPaste = true; importSheet(); return $('#imp-paste')?.focus();
    case 'rm-file': imp.files.splice(+t.dataset.i, 1); return importSheet();
    case 'analyze': return analyze();
    case 'cancel-import': imp.ctl?.abort(); imp.step = 'pick'; return importSheet();
    case 'import-back': imp.step = 'pick'; return importSheet();
    case 'toggle-item': { const it = imp.result.items[+t.dataset.i]; it.keep = !it.keep; return keepReviewScroll(); }
    case 'edit-item': { commitEdits(); const i = +t.dataset.i; imp.editing = imp.editing === i ? null : i; keepReviewScroll(); return $('#ed-es-' + i)?.focus(); }
    case 'save-import': commitEdits(); return saveImport();
    case 'lesson': sheetOpenUnit = null; return lessonSheet(t.dataset.lesson);
    case 'unit-open': { const y = $('#sheet-body')?.scrollTop || 0; sheetOpenUnit = sheetOpenUnit === t.dataset.unit ? null : t.dataset.unit; lessonSheet(BUILT.lessons.find(l => l.units.some(u => u.id === t.dataset.unit)).id); $('#sheet-body').scrollTop = y; return; }
    case 'ask-del': return lessonSheet(t.dataset.lesson, true);
    case 'del-lesson': { const id = t.dataset.lesson; items().filter(i => i.lessonId === id).forEach(i => Store.del('items', i.id)); Store.del('lessons', id); closeSheet(); toast('Lezione eliminata'); return render(); }
    case 'word': { openWord = openWord === t.dataset.id ? null : t.dataset.id; const w = items().find(i => i.id === t.dataset.id); if (openWord && w && w.kind !== 'drill') speak(w.es); return render(); }
    case 'more': bookLimit += 120; return render();
    case 'start': return startSession(t.dataset.scope, t.dataset.arg);
    case 'say': return speak(t.dataset.text);
    case 'say-slow': return speak(t.dataset.text, true);
    case 'check': return check(false);
    case 'skip': return check(true);
    case 'explain': return explainError();
    case 'self-tr': S.state = 'ask'; return conclude(t.dataset.r, t.dataset.r === 'ok' ? 'Il tutor scriveva: ' + S.ex.d.es[0] : '');
    case 'reveal': { $('#rv').hidden = false; S.state = 'self'; $('#sfoot').innerHTML = `<div class="s-foot-in"><div class="selfgrade"><button class="btn bad" data-action="self" data-g="1">Non lo sapevo</button><button class="btn ok" data-action="self" data-g="3">Lo sapevo</button></div></div>`; return speak(S.ex.item.es); }
    case 'self': { const g = +t.dataset.g; grade_(S.ex.item, g); tone(g > 1 ? 'ok' : 'bad'); S.state = 'shown'; return next(); }
    case 'next': return next();
    case 'quit': return quit();
    case 'say-start': return startSay(t.dataset.arg);
    case 'say-mic': return sayMic();
    case 'say-check': { const v = $('#dict-in')?.value.trim(); if (v && Tk?.state === 'ask') judgeSay([v]); return; }
    case 'say-retry': return sayRetry();
    case 'say-skip': case 'say-next': stopListen(); Tk.i++; return showSay();
    case 'say-again': return startSay(Tk?.snd?.k || 'rep');
    case 'talk-quit': return quitTalk();
    case 'conv-start': stopListen(); Tk?.ctl?.abort(); return startConv(t.dataset.arg);
    case 'c-send': return convSend();
    case 'c-mic': return convMic();
    case 'c-hint': Tk.showHints = !Tk.showHints; return convHints();
    case 'c-usehint': { const ta = $('#c-in'); if (ta) { ta.value = t.dataset.text; ta.dispatchEvent(new Event('input')); ta.focus(); } speak(t.dataset.text); return; }
    case 'c-tr': { const m = Tk.msgs[+t.dataset.i]; if (m) m.showIt = !m.showIt; const y = $('#sbody').scrollTop; renderConv(); $('#sbody').scrollTop = y; return; }
    case 'c-end': return finishConv();
    case 'gram-open': { const id = t.dataset.id; closeSheet(); return gramDone(id) ? gramSheet(id) : startGram(id); }
    case 'gram-study': closeSheet(); return startGram(t.dataset.id);
    case 'gram-next': haptic('tap'); Tk.i++; return showGram();
    case 'gram-check': return gramCheck();
    case 'gram-practice': { const id = t.dataset.id; quitTalk(); return startSession('topic', id); }
    case 'voice': saveProfile({voice:t.dataset.uri}); pickVoice(); speak('¡Hola! ¿Qué tal? Vamos a repasar un poco de español.'); return settingsSheet();
    case 'voice-try': { const keep = esVoice; esVoice = esVoices.find(v => v.voiceURI === t.dataset.uri) || keep; speak('¡Hola! ¿Qué tal? Vamos a repasar un poco de español.'); esVoice = keep; return; }
  }
});
function commitEdits(){
  if (imp.editing == null || !imp.result) return;
  const i = imp.editing, it = imp.result.items[i];
  const es = $('#ed-es-' + i)?.value.trim(), itx = $('#ed-it-' + i)?.value.trim();
  if (es) it.es = es; if (itx) it.it = itx;
}
function keepReviewScroll(){ const y = $('#sheet-body')?.scrollTop || 0; const title = $('#rv-title')?.value, date = $('#rv-date')?.value; if (title) imp.result.title = title; if (date) imp.date = date; importSheet(); $('#sheet-body').scrollTop = y; }
document.addEventListener('input', e => { if (e.target.id === 'book-q') { bookQuery = e.target.value; bookLimit = 120; const pos = e.target.selectionStart; render(); const q = $('#book-q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => {
  if (Tk) {
    if (e.key === 'Escape') return quitTalk();
    if (Tk.kind === 'gram') {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const c = $('#check'); if (c && !c.disabled && Tk.state === 'ask') return gramCheck(); return $('#cont')?.click(); }
      if (/^[1-4]$/.test(e.key)) gramSelect(+e.key - 1);
      return;
    }
    if (Tk.kind === 'conv') { if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'c-in') { e.preventDefault(); convSend(); } return; }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (Tk.state !== 'ask') return $('#cont')?.click(); const c = $('#say-check'); if (c && !c.disabled) c.click(); return; }
    if (e.key === ' ' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON' && Tk.state === 'ask' && canListen()) { e.preventDefault(); sayMic(); }
    return;
  }
  if (!S) { if (e.key === 'Escape' && $('#layer').innerHTML) closeSheet(); return; }
  const inField = e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT';
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (S.state === 'shown' || S.state === 'done' || S.ex?.intro) return $('#cont')?.click();
    const c = $('#check'); if (c && !c.disabled && S.state === 'ask') return check(false);
    if (S.ex?.type === 'reveal' && S.state === 'ask') return $('[data-action="reveal"]')?.click();
    return;
  }
  if (!inField && /^[1-6]$/.test(e.key)) selectOpt(+e.key - 1);
  if (e.key === 'Escape') quit();
});

/* ---------------- boot ---------------- */
paintNav(); render();
(async () => {
  await Store.init();
  pickVoice();
  try { sampleFn = window.claude?.use ? await claude.use('sample') : null; } catch { sampleFn = null; }
  paintNav(); render();
  if ($('#layer .sheet') && imp.step === 'pick') importSheet();
})();
</script>

</body></html>
